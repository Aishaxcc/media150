<!DOCTYPE html>
<html>
<head>
  <title>Drink Break</title>

  <style>
    body {
      margin: 0;
      font-family: "Times New Roman", serif;

      background:
      linear-gradient(rgba(20,20,20,0.45), rgba(20,20,20,0.45)),
      url('images/drink.png');

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      height: 100vh;
      overflow: hidden;

      color: white;
    }

    .box {
      position: absolute;

      top: 50%;
      right: 60px;

      transform: translateY(-50%);

      width: 420px;

      background: rgba(15, 15, 15, 0.72);

      padding: 35px;

      border-radius: 18px;

      text-align: left;

      backdrop-filter: blur(6px);

      box-shadow: 0px 0px 30px rgba(0,0,0,0.35);
    }

    h1 {
      font-size: 46px;
      margin-top: 0;
    }

    p {
      font-size: 21px;
      line-height: 1.6;
    }

    .buttons {
      margin-top: 25px;
    }

    a {
      display: inline-block;

      margin-right: 12px;
      margin-top: 10px;

      padding: 14px 22px;

      background: #7c5cff;

      color: white;

      text-decoration: none;

      border-radius: 10px;

      transition: 0.3s ease;
    }

    a:hover {
      background: #ffe4ef;
      color: black;

      transform: scale(1.05);
    }

  </style>
</head>

<body>

<div class="box">

  <h1>Drink Break</h1>

  <p>
    You grab an overpriced iced coffee and try to relax.
  </p>

  <p>
    For a second, it works.
    The noise of the building fades into the background.
  </p>

  <p>
    Then your elbow bumps the cup.
  </p>

  <div class="buttons">

    <a href="ending-spill.html">Catch the drink</a>

    <a href="decision.html">Walk away awkwardly</a>

  </div>

</div>

</body>
</html>
