<!DOCTYPE html>
<html>
<head>
  <title>Ask First</title>

  <style>
    body {
      margin: 0;
      font-family: "Times New Roman", serif;

      background-image:
      linear-gradient(rgba(20,10,40,0.35), rgba(20,10,40,0.35)),
      url('images/ask.png');

      background-size: cover;
      background-position: center;

      height: 100vh;
      overflow: hidden;
      color: white;
    }

    .box {
      position: absolute;

      top: 50%;
      right: 70px;

      transform: translateY(-50%);

      width: 420px;

      background: rgba(45,18,84,0.72);

      backdrop-filter: blur(8px);

      padding: 30px;

      border-radius: 18px;

      box-shadow: 0 0 30px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 44px;
      margin-top: 0;
    }

    p {
      font-size: 21px;
      line-height: 1.6;
    }

    .buttons {
      margin-top: 25px;
    }

    a {
      display: inline-block;

      margin-right: 12px;
      margin-top: 10px;

      padding: 14px 22px;

      background: #7d5fff;

      color: white;

      text-decoration: none;

      border-radius: 10px;

      transition: 0.3s;
    }

    a:hover {
      background: #ffe4ef;
      color: black;
    }

  </style>
</head>

<body>

<div class="box">

  <h1>You Ask First</h1>

  <p>
    “Is anyone sitting here?” you ask.
  </p>

  <p>
    The student looks up for a second and says,
    “Uh… no.”
  </p>

  <p>
    But their bag, charger, coffee, jacket,
    and notebook are still spread across the entire couch.
  </p>

  <div class="buttons">
    <a href="drink.html">Relax with a drink</a>

    <a href="decision.html">Still feel unsure</a>
  </div>

</div>

</body>
</html>
