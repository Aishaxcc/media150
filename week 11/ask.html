<!DOCTYPE html>
<html>
<head>
  <title>Ask First</title>

  <style>
    body {
      margin: 0;
      font-family: "Times New Roman", serif;

      background:
      linear-gradient(rgba(20,20,20,0.45), rgba(20,20,20,0.45)),
      url('images/ask.png');

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      overflow: hidden;
      color: white;
    }

    .box {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      width: 75%;

      background: rgba(15, 15, 15, 0.72);

      padding: 35px;
      border-radius: 16px;

      text-align: center;

      backdrop-filter: blur(4px);

      box-shadow: 0px 0px 30px rgba(0,0,0,0.35);
    }

    h1 {
      font-size: 54px;
      margin-bottom: 15px;
    }

    p {
      font-size: 22px;
      line-height: 1.6;
      max-width: 900px;
      margin: auto;
      margin-bottom: 12px;
    }

    .buttons {
      margin-top: 28px;
    }

    a {
      display: inline-block;

      margin: 10px;
      padding: 14px 26px;

      background: #7c5cff;

      color: white;
      text-decoration: none;

      border-radius: 10px;

      font-size: 18px;

      transition: 0.3s ease;
    }

    a:hover {
      background: #ffe4ef;
      color: black;

      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>You Ask First</h1>

    <p>
      “Is anyone sitting here?” you ask quietly.
    </p>

    <p>
      The person says no, but their bag, charger,
      coat, coffee, and notebook still take up most
      of the space.
    </p>

    <p>
      You sit anyway, but suddenly become hyperaware
      of every movement your body makes.
    </p>

    <div class="buttons">
      <a href="drink.html">Relax with a drink</a>

      <a href="decision.html">Still feel unsure</a>
    </div>

  </div>

</body>
</html>
