<!DOCTYPE html>
<html>
<head>
  <title>Ask First</title>
  <style>
    body {
      margin: 0;
      font-family: "Times New Roman", serif;
      background: linear-gradient(rgba(45,18,84,0.75), rgba(45,18,84,0.75)), url('images/ask.jpg');
      background-size: cover;
      background-position: center;
      color: white;
    }

    .box {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      width: 75%;
      background: rgba(45, 18, 84, 0.9);
      padding: 30px;
      border-radius: 12px;
      text-align: center;
    }

    h1 { font-size: 42px; }
    p { font-size: 20px; line-height: 1.5; }

    a {
      display: inline-block;
      margin: 10px;
      padding: 12px 20px;
      background: #6b4eff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    a:hover {
      background: #ffe4ef;
      color: black;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>You Ask First</h1>
    <p>“Is anyone sitting here?” you ask.</p>
    <p>The person says no, but their bag, charger, coat, and coffee are still spread across the space.</p>

    <a href="drink.html">Relax with a drink</a>
    <a href="decision.html">Still feel unsure</a>
  </div>
</body>
</html>
