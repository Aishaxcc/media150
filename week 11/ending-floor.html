<!DOCTYPE html>
<html>
<head>
  <title>Saved Seat</title>

  <style>

    body {
      margin: 0;
      font-family: "Times New Roman", serif;

      background:
      linear-gradient(rgba(20,20,20,0.25), rgba(20,20,20,0.25)),
      url('images/saved-seat.png');

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      height: 100vh;
      overflow: hidden;

      color: white;
    }

    .box {

      position: absolute;

      top: 50%;
      right: 60px;

      transform: translateY(-50%);

      width: 390px;

      background: rgba(10,10,10,0.72);

      padding: 34px;

      border-radius: 18px;

      text-align: left;

      backdrop-filter: blur(8px);

      box-shadow: 0 0 30px rgba(0,0,0,0.35);

    }

    h1 {
      font-size: 56px;
      margin-top: 0;
      margin-bottom: 18px;
    }

    p {
      font-size: 22px;
      line-height: 1.7;
      margin-bottom: 18px;
    }

    .buttons {
      margin-top: 28px;
    }

    a {

      display: inline-block;

      margin-right: 12px;

      padding: 14px 24px;

      background: #7c5cff;

      color: white;

      text-decoration: none;

      border-radius: 10px;

      font-size: 18px;

      transition: 0.3s ease;

    }

    a:hover {

      background: #ffe4ef;
      color: black;

      transform: scale(1.05);

    }

  </style>
</head>

<body>

  <div class="box">

    <h1>You Sit Down</h1>

    <p>
      For three seconds, everything feels peaceful.
    </p>

    <p>
      Then someone says,
      “Sorry, I was saving that.”
      The whole room suddenly feels too quiet.
    </p>

    <div class="buttons">

      <a href="drink.html">Escape and get a drink</a>

      <a href="decision.html">Stay and think</a>

    </div>

  </div>

</body>
</html>
