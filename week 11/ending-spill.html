<!DOCTYPE html>
<html>
<head>
  <title>The Spill</title>

  <style>

    body {
      margin: 0;
      font-family: "Times New Roman", serif;

      background:
      linear-gradient(rgba(20,20,20,0.20), rgba(20,20,20,0.20)),
      url('images/ending-spill.png');

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      height: 100vh;
      overflow: hidden;

      color: white;
    }

    .box {

      position: absolute;

      top: 50%;
      left: 60px;

      transform: translateY(-50%);

      width: 390px;

      background: rgba(10,10,10,0.72);

      padding: 34px;

      border-radius: 18px;

      text-align: left;

      backdrop-filter: blur(8px);

      box-shadow: 0 0 30px rgba(0,0,0,0.35);

    }

    h1 {
      font-size: 56px;
      margin-top: 0;
      margin-bottom: 18px;
    }

    p {
      font-size: 22px;
      line-height: 1.7;
      margin-bottom: 18px;
    }

    .buttons {
      margin-top: 28px;
    }

    a {

      display: inline-block;

      padding: 14px 24px;

      background: #7c5cff;

      color: white;

      text-decoration: none;

      border-radius: 10px;

      font-size: 18px;

      transition: 0.3s ease;

    }

    a:hover {

      background: #ffe4ef;
      color: black;

      transform: scale(1.05);

    }

  </style>
</head>

<body>

  <div class="box">

    <h1>The Spill</h1>

    <p>
      The drink slips straight out of your hand.
    </p>

    <p>
      Ice flies everywhere.
      Coffee spills across the floor.
      Someone gasps dramatically.
    </p>

    <p>
      You briefly consider transferring schools.
    </p>

    <div class="buttons">

      <a href="index.html">Restart nightmare</a>

    </div>

  </div>

</body>
</html>
